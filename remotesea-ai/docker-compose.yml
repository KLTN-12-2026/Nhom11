services:
  # This service's own database — deliberately not the remotesea-api Supabase
  # instance (see README: "AI Service phải là một service độc lập"). Port
  # 5434 (not 5432/5433 — both already claimed locally by other projects'
  # Postgres containers on this machine) so it can run alongside them without
  # colliding.
  # pgvector/pgvector:pg16, not plain postgres:16-alpine — same Postgres 16
  # underneath (just the pgvector extension pre-installed). RAG chunk
  # *vectors* now live in Qdrant (app/infrastructure/qdrant_client.py), not
  # here — remotesea_rag only needs this image for its regular tables
  # (RagDocument, the slim RagChunk metadata/content rows). Kept anyway:
  # the main database (remotesea_ai)'s ai_conversation_turns.embedding —
  # chat cross-session grounding, unrelated to RAG — still needs pgvector.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ai_service
      POSTGRES_PASSWORD: ai_service
      POSTGRES_DB: remotesea_ai
    ports:
      - "5434:5432"
    volumes:
      - ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_service -d remotesea_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: .
    env_file: .env
    environment:
      # Inside Docker's network, "localhost" means the container itself —
      # override the .env file's host-facing DATABASE_URL/RAG_DATABASE_URL
      # to the compose service name instead. RAG_DATABASE_URL was missed
      # when RAG was added (code-review finding) — without this override the
      # container would still resolve it to .env's localhost:5434, breaking
      # every RAG-touching call in this containerized deploy path even
      # though local (non-docker) dev works fine and masks the bug.
      # OLLAMA_BASE_URL stays host.docker.internal:11434 (see .env.example)
      # since Ollama runs natively on the host, not as a container here —
      # its Docker image bundles CUDA libraries for GPU inference this
      # machine can't use, and was 10GB+ of dead weight on a disk-constrained
      # dev box for zero benefit over the native binary.
      DATABASE_URL: postgresql+asyncpg://ai_service:ai_service@postgres:5432/remotesea_ai
      RAG_DATABASE_URL: postgresql+asyncpg://ai_service:ai_service@postgres:5432/remotesea_rag
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ai_postgres_data:
